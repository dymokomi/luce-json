name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: Gate (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, host: arm64-macos }
          - { runner: ubuntu-24.04, host: x86_64-linux }
          - { runner: ubuntu-24.04-arm, host: arm64-linux }
    defaults:
      run:
        shell: bash
        working-directory: luce-json
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-json
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git
          python3 luce-base/tools/checkout_main.py luce-json
          (cd luce-base && ./build.sh)
      - name: Select Clang for generated C
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Run the gate
        run: LUCE_BASE="$PWD/../luce-base/build/luce-base" ./test.sh
